user  root;
worker_processes  1;

events {
}

http {
    server {
        listen       80;

        location / {
            proxy_pass http://frontend-pr:3000/;
        }

        location /api/ {
            proxy_pass http://django-pr:8000/;
        }

        location /static/ {
            alias /usr/share/nginx/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}